name: Android APK + AAB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Android platform
        run: test -d android && test -f android/gradlew && test -f android/capacitor.settings.gradle

      - name: Brand app icons
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icons/icon-512.png android/app/src/main/res/mipmap-${d}/ic_launcher.png || true
            cp public/icons/icon-512.png android/app/src/main/res/mipmap-${d}/ic_launcher_round.png || true
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wihgo-ai-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: WIHGO AI APK ${{ github.run_number }}
          files: |
            app/android/app/build/outputs/apk/debug/app-debug.apk
